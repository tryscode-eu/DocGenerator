name: DocGenerator CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docgenerator-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12.13"
      - name: Install locked development dependencies
        run: |
          python -m pip install --require-hashes --requirement worker/requirements-dev.lock
          python -m pip install --no-deps --no-build-isolation --editable worker
          python -m pip check
      - name: Scan high-confidence secret signatures
        run: sh .github/scripts/scan_high_confidence_secrets.sh
      - name: Lint and format check
        run: |
          python -m ruff check main.py tests worker/doc_worker worker/tests \
            worker/scripts/prove_minio_artifact_chain.py \
            worker/scripts/prove_rabbitmq_archive.py
          python -m ruff format --check main.py tests worker/doc_worker worker/tests \
            worker/scripts/prove_minio_artifact_chain.py \
            worker/scripts/prove_rabbitmq_archive.py
      - name: Validate proof scripts
        run: |
          python -m py_compile \
            worker/scripts/prove_minio_artifact_chain.py \
            worker/scripts/prove_rabbitmq_archive.py
          sh -n worker/scripts/run_minio_artifact_proof.sh
          sh -n worker/scripts/run_rabbitmq_archive_proof.sh
      - name: Test ODT engine and document worker
        run: PYTHONDONTWRITEBYTECODE=1 python -m pytest -q -p no:cacheprovider tests worker/tests
      - name: Compile Python sources
        run: >-
          python -m compileall -q
          main.py tests worker/doc_worker worker/tests
          worker/scripts/prove_minio_artifact_chain.py
          worker/scripts/prove_rabbitmq_archive.py
      - name: Validate the inactive Kubernetes candidate
        run: >-
          docker run --rm --read-only --cap-drop ALL --security-opt no-new-privileges
          -v "$PWD:/work:ro"
          ghcr.io/yannh/kubeconform:v0.7.0@sha256:85dbef6b4b312b99133decc9c6fc9495e9fc5f92293d4ff3b7e1b30f5611823c
          -strict -summary /work/deploy/kubernetes/foundation.yaml
      - name: Build worker wheel
        run: python -m build --no-isolation --wheel --outdir /tmp/docgenerator-dist worker
      - name: Build worker image
        run: |
          docker build --check --file worker/Dockerfile worker
          docker build --file worker/Dockerfile --tag docgenerator-worker:test worker
      - name: Verify worker image boundaries
        run: |
          test "$(docker image inspect --format '{{.Config.User}}' docgenerator-worker:test)" = "10001:10001"
          test "$(docker image inspect --format '{{range .Config.Env}}{{println .}}{{end}}' docgenerator-worker:test | grep '^DOCUMENT_OUTPUT_DIR=')" = "DOCUMENT_OUTPUT_DIR=/data/documents"
          docker run --rm --entrypoint python docgenerator-worker:test -c \
            "import importlib.util, os; assert (os.getuid(), os.getgid()) == (10001, 10001); assert os.access('/data/documents', os.W_OK); assert importlib.util.find_spec('pytest') is None; import doc_worker.main"
      - name: Smoke worker without external effects
        run: |
          id="$(docker run -d --read-only --network none --cap-drop ALL --security-opt no-new-privileges --tmpfs /data/documents:rw,nosuid,nodev,noexec,size=16m -e WORKER_MODE=safe_idle -e HEALTH_HOST=0.0.0.0 -e TRYSCODE_ENVIRONMENT=ci docgenerator-worker:test)"
          trap 'docker rm -f "${id}" >/dev/null 2>&1 || true' EXIT
          ready=false
          for _ in $(seq 1 30); do
            if docker exec "${id}" python -c "from urllib.request import urlopen; assert urlopen('http://127.0.0.1:8080/health/ready', timeout=2).status == 200" 2>/dev/null; then
              ready=true
              break
            fi
            sleep 1
          done
          test "${ready}" = true
          test "$(docker exec "${id}" id -u)" = 10001
          docker stop --timeout 10 "${id}"
